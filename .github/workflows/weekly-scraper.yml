# WhoFundsOSS weekly sponsorship scraper.
# Cron: Monday 06:17 Europe/Paris in summer (UTC+2) = 04:17 UTC.
# In winter (UTC+1) the same cron lands at 05:17 Paris — acceptable per CdP.
name: weekly-scraper

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      max_oc:
        description: "Optional cap on Open Collective collectives (smoke only; leave empty for FULL coverage = all ~104 collectives)"
        required: false
        default: ""
      max_osp:
        description: "Optional cap on Open Source Pledge members (smoke only; leave empty for FULL coverage)"
        required: false
        default: ""
      gh_logins:
        description: "Optional comma-separated GitHub logins (smoke only; leave empty for FULL catalog GH set ~281)"
        required: false
        default: ""

# Minimum permissions. Do not broaden.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Require WFO_WEEKLY_PAT
        env:
          WFO_WEEKLY_PAT: ${{ secrets.WFO_WEEKLY_PAT }}
        run: |
          set -euo pipefail
          # Inline copy of scripts/weekly/require_pat.sh (runs before checkout).
          # Never print the secret value.
          if [ -z "${WFO_WEEKLY_PAT}" ]; then
            echo "::error::Missing repository secret WFO_WEEKLY_PAT (empty)."
            echo "Create a fine-grained PAT (Contents: R/W, Pull requests: R/W on silentdany/whofundsoss)"
            echo "and store it as Actions secret WFO_WEEKLY_PAT. Broader scopes not required."
            exit 1
          fi
          echo "WFO_WEEKLY_PAT: present (value not logged)"

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ secrets.WFO_WEEKLY_PAT }}

      - name: Ensure scraper code is present on this ref
        run: |
          set -euo pipefail
          if [ ! -f scripts/weekly/run.py ]; then
            echo "::error::scripts/weekly/run.py missing on this ref. Refusing to run."
            exit 1
          fi

      - name: Re-check WFO_WEEKLY_PAT via repo script
        env:
          WFO_WEEKLY_PAT: ${{ secrets.WFO_WEEKLY_PAT }}
        run: bash scripts/weekly/require_pat.sh

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Unit tests (no network)
        run: python3 -m unittest scripts.weekly.test_weekly -v

      - name: Run weekly scraper
        env:
          # Never echo. Actions masks secrets; we still avoid printing env.
          GH_TOKEN: ${{ secrets.GH_SPONSORS_TOKEN || secrets.WFO_WEEKLY_PAT }}
          GH_SPONSORS_TOKEN: ${{ secrets.GH_SPONSORS_TOKEN || '' }}
          # User-controlled workflow_dispatch inputs MUST go through env, never
          # interpolated as ${{ inputs.* }} inside run: (injection risk).
          INPUT_MAX_OC: ${{ inputs.max_oc }}
          INPUT_MAX_OSP: ${{ inputs.max_osp }}
          INPUT_GH_LOGINS: ${{ inputs.gh_logins }}
        run: |
          set -euo pipefail
          DATE=$(date -u +%F)
          EXTRA=()
          if [ -n "${INPUT_MAX_OC}" ]; then EXTRA+=(--max-oc "${INPUT_MAX_OC}"); fi
          if [ -n "${INPUT_MAX_OSP}" ]; then EXTRA+=(--max-osp "${INPUT_MAX_OSP}"); fi
          if [ -n "${INPUT_GH_LOGINS}" ]; then EXTRA+=(--gh-logins "${INPUT_GH_LOGINS}"); fi
          python3 -m scripts.weekly.run --date "$DATE" "${EXTRA[@]}"
          ls -la "data/weekly/${DATE}.json" "data/weekly/${DATE}.md"
          python3 -c "import json,sys; p=json.load(open('data/weekly/'+sys.argv[1]+'.json')); st=[s['status'] for s in p.get('sources',[])]; print('source statuses:', st); assert any(s=='ok' for s in st), 'refusing PR: every source unavailable'" "$DATE"

      - name: Upload weekly artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: weekly-${{ github.run_id }}
          path: |
            data/weekly/*.json
            data/weekly/*.md
          if-no-files-found: error

      - name: Open data-only PR from main
        env:
          GH_TOKEN: ${{ secrets.WFO_WEEKLY_PAT }}
          WFO_WEEKLY_PAT: ${{ secrets.WFO_WEEKLY_PAT }}
          RUN_ID: ${{ github.run_id }}
        run: bash scripts/weekly/open_data_pr.sh
