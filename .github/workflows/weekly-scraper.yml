# WhoFundsOSS weekly sponsorship scraper.
# Cron: Monday 06:17 Europe/Paris in summer (UTC+2) = 04:17 UTC.
# In winter (UTC+1) the same cron lands at 05:17 Paris — acceptable per CdP.
name: weekly-scraper

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      max_oc:
        description: "Optional cap on Open Collective collectives (smoke only; leave empty for FULL coverage = all ~104 collectives)"
        required: false
        default: ""
      max_osp:
        description: "Optional cap on Open Source Pledge members (smoke only; leave empty for FULL coverage)"
        required: false
        default: ""
      gh_logins:
        description: "Optional comma-separated GitHub logins (smoke only; leave empty for FULL catalog GH set ~281)"
        required: false
        default: ""
      force:
        description: "Skip the duplicate guard: run even if data for today (Paris date) already exists on main or in an open/merged data PR. This creates a SECOND data PR for the same date. On a Monday the run is on-cycle and DOES count as that week's reading; it does not bypass the off-cycle guard on other days."
        type: boolean
        required: false
        default: false
      allow_off_cycle:
        description: "Allow a manual run on a day other than Monday (Europe/Paris). The snapshot is marked offCycle and never counts toward the two-readings rules (cannot release pending holds early)."
        type: boolean
        required: false
        default: false

# Nothing at workflow level; each job declares its own (minimal) permissions.
# scrape writes through WFO_WEEKLY_PAT, not GITHUB_TOKEN.
permissions: {}

concurrency:
  group: weekly-scraper
  cancel-in-progress: false

jobs:
  # A late cron (e.g. run 38246276121, 14:00 Paris) must not open a second data
  # PR for a date that already has one. Read-only job on the built-in
  # GITHUB_TOKEN (no PAT). Closed, unmerged PRs do not count, nor do fork PRs
  # or PRs by an author other than the PAT account / github-actions bot
  # (DATA_PR_AUTHORS in existing_data_pr.py). Also computes the run DATE once
  # for every later job (job output), so a run crossing 00:00 UTC stays on one date.
  dedupe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      date: ${{ steps.cycle.outputs.date }}
      off_cycle: ${{ steps.cycle.outputs.off_cycle }}
    steps:
      - name: Checkout (guard script only)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: scripts/weekly

      # Manual runs off the Paris Monday are refused without allow_off_cycle
      # (PR #41: a mid-week run released pending holds early).
      - name: Off-cycle guard (Monday, Europe/Paris)
        id: cycle
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ALLOW_OFF_CYCLE: ${{ inputs.allow_off_cycle }}
        run: |
          set -euo pipefail
          python3 -m unittest scripts.weekly.test_off_cycle
          OUT=$(python3 -m scripts.weekly.off_cycle --event "$EVENT_NAME" --allow "${INPUT_ALLOW_OFF_CYCLE:-false}")
          echo "$OUT"
          [[ "$OUT" =~ ^off_cycle=(true|false)$'\n'date=[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::unexpected guard output"; exit 1; }
          echo "$OUT" >> "$GITHUB_OUTPUT"

      - name: Skip if a data PR already exists for this date
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_FORCE: ${{ inputs.force }}
          # Paris run date from the off-cycle guard (never `date -u`).
          DATE: ${{ steps.cycle.outputs.date }}
        run: |
          set -euo pipefail
          [[ "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::Invalid DATE from guard"; exit 1; }
          if [ "${INPUT_FORCE:-false}" = "true" ]; then
            echo "force=true: not checking for an existing data PR"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # data/weekly/<date>.json already on main? 404 = no. Any other error
          # (auth, rate limit, 5xx) is logged and fails the job closed.
          ON_MAIN=()
          if OUT=$(gh api "repos/${GITHUB_REPOSITORY}/contents/data/weekly/${DATE}.json?ref=main" --silent 2>&1); then
            ON_MAIN=(--on-main)
          elif printf '%s' "$OUT" | grep -q "HTTP 404"; then
            echo "data/weekly/${DATE}.json not on main"
          else
            echo "::error::contents API check failed: ${OUT:0:300}"
            exit 1
          fi
          # Plain list (newest first), not the search API: no index lag.
          PR_LIMIT=200
          gh pr list --repo "$GITHUB_REPOSITORY" --state all --limit "$PR_LIMIT" \
            --json number,url,state,headRefName,files,isCrossRepository,author,createdAt > "$RUNNER_TEMP/prs.json"
          # Exit codes: 0 = data exists (skip), 1 = none (run, must print "none"),
          # anything else = error -> fail closed.
          RC=0
          EXISTING=$(python3 -m scripts.weekly.existing_data_pr "$DATE" --limit "$PR_LIMIT" "${ON_MAIN[@]}" < "$RUNNER_TEMP/prs.json") || RC=$?
          case "$RC" in
            0) echo "::notice::Data for ${DATE} already exists (${EXISTING:0:300}). Skipping this run."
               echo "skip=true" >> "$GITHUB_OUTPUT" ;;
            1) if [ "$EXISTING" != "none" ]; then
                 echo "::error::existing_data_pr exited 1 without its 'none' marker (crash?)"
                 exit 1
               fi
               echo "skip=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::existing_data_pr failed (exit ${RC}): ${EXISTING:0:300}"; exit 1 ;;
          esac

  scrape:
    needs: dedupe
    if: needs.dedupe.outputs.skip != 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Require WFO_WEEKLY_PAT
        env:
          WFO_WEEKLY_PAT: ${{ secrets.WFO_WEEKLY_PAT }}
        run: |
          set -euo pipefail
          # Inline copy of scripts/weekly/require_pat.sh (runs before checkout).
          # Never print the secret value.
          if [ -z "${WFO_WEEKLY_PAT}" ]; then
            echo "::error::Missing repository secret WFO_WEEKLY_PAT (empty)."
            echo "Create a fine-grained PAT (Contents: R/W, Pull requests: R/W on silentdany/whofundsoss)"
            echo "and store it as Actions secret WFO_WEEKLY_PAT. Broader scopes not required."
            exit 1
          fi
          echo "WFO_WEEKLY_PAT: present (value not logged)"

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ secrets.WFO_WEEKLY_PAT }}
          persist-credentials: false

      - name: Ensure scraper code is present on this ref
        run: |
          set -euo pipefail
          if [ ! -f scripts/weekly/run.py ]; then
            echo "::error::scripts/weekly/run.py missing on this ref. Refusing to run."
            exit 1
          fi

      - name: Re-check WFO_WEEKLY_PAT via repo script
        env:
          WFO_WEEKLY_PAT: ${{ secrets.WFO_WEEKLY_PAT }}
        run: bash scripts/weekly/require_pat.sh

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Unit tests (no network)
        run: python3 -m unittest scripts.weekly.test_weekly scripts.weekly.test_qa_blockers scripts.weekly.test_off_cycle scripts.weekly.test_off_cycle_rules -v

      - name: Run weekly scraper
        env:
          # Never echo. Actions masks secrets; we still avoid printing env.
          GH_TOKEN: ${{ secrets.GH_SPONSORS_TOKEN || secrets.WFO_WEEKLY_PAT }}
          GH_SPONSORS_TOKEN: ${{ secrets.GH_SPONSORS_TOKEN || '' }}
          # User-controlled workflow_dispatch inputs MUST go through env, never
          # interpolated as ${{ inputs.* }} inside run: (injection risk).
          INPUT_MAX_OC: ${{ inputs.max_oc }}
          INPUT_MAX_OSP: ${{ inputs.max_osp }}
          INPUT_GH_LOGINS: ${{ inputs.gh_logins }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          RUN_DATE: ${{ needs.dedupe.outputs.date }}
          OFF_CYCLE: ${{ needs.dedupe.outputs.off_cycle }}
        run: |
          set -euo pipefail
          DATE="${RUN_DATE}"
          [[ "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::Invalid DATE from dedupe"; exit 1; }
          EXTRA=()
          if [ -n "${INPUT_MAX_OC}" ]; then EXTRA+=(--max-oc "${INPUT_MAX_OC}"); fi
          if [ -n "${INPUT_MAX_OSP}" ]; then EXTRA+=(--max-osp "${INPUT_MAX_OSP}"); fi
          if [ -n "${INPUT_GH_LOGINS}" ]; then EXTRA+=(--gh-logins "${INPUT_GH_LOGINS}"); fi
          if [ "${OFF_CYCLE}" = "true" ]; then EXTRA+=(--off-cycle); echo "::warning::off-cycle run: snapshot marked offCycle"; fi
          python3 -m scripts.weekly.run --date "$DATE" "${EXTRA[@]}"
          ls -la "data/weekly/${DATE}.json" "data/weekly/${DATE}.md"
          python3 -c "import json,sys; p=json.load(open('data/weekly/'+sys.argv[1]+'.json')); st=[s['status'] for s in p.get('sources',[])]; print('source statuses:', st); assert any(s=='ok' for s in st), 'refusing PR: every source unavailable'" "$DATE"

      - name: Upload weekly artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: weekly-${{ github.run_id }}
          path: |
            data/weekly/*.json
            data/weekly/*.md
          if-no-files-found: error

      - name: Open data-only PR from main
        env:
          GH_TOKEN: ${{ secrets.WFO_WEEKLY_PAT }}
          WFO_WEEKLY_PAT: ${{ secrets.WFO_WEEKLY_PAT }}
          RUN_ID: ${{ github.run_id }}
          RUN_DATE: ${{ needs.dedupe.outputs.date }}
        run: |
          set -euo pipefail
          DATE="${RUN_DATE}"
          if ! [[ "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::Invalid DATE"
            exit 1
          fi
          export DATE
          bash scripts/weekly/open_data_pr.sh
